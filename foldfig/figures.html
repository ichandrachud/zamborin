<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Fold figures — contact sheet</title>
  <meta name="robots" content="noindex" />
  <link rel="icon" type="image/svg+xml" href="/images/zamborin-favicon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root { --paper: #F3EEE3; }
    body { margin: 0; background: #0E1726; color: #fff; font-family: Inter, system-ui, sans-serif; padding: 28px; }
    h1 { font-size: 26px; margin: 0 0 4px; }
    p.sub { color: rgba(255,255,255,0.66); margin: 0 0 22px; font-size: 15px; line-height: 1.55; max-width: 720px; }
    .controls { display: flex; gap: 18px; align-items: center; margin-bottom: 22px; flex-wrap: wrap; font-size: 14px; }
    label { color: rgba(255,255,255,0.8); display: flex; gap: 7px; align-items: center; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 16px; }
    .cell { background: var(--paper); border-radius: 12px; padding: 8px; }
    .cell canvas { display: block; width: 100%; height: auto; }
    .name { text-align: center; font-size: 12px; font-weight: 700; color: rgba(255,255,255,0.78);
            margin-top: 6px; letter-spacing: 0.3px; text-transform: uppercase; }
    .wrap { display: flex; flex-direction: column; }
  </style>
</head>
<body>
  <h1>Fold figures</h1>
  <p class="sub">Every figure gets sliced into this many tiles and scattered across the sheet, so each one has to still read when it is cut up. Turn the slice guides on to see where the cuts fall.</p>
  <div class="controls">
    <label>Slice <select id="grid"><option value="0">off</option><option value="3">3 × 3</option><option value="4">4 × 4</option></select></label>
    <label>Colour <select id="mode"><option value="cycle">as in game (cycles)</option><option value="one">all one colour</option></select></label>
    <span id="count" style="color:rgba(255,255,255,0.55)"></span>
  </div>
  <div class="grid" id="grid-out"></div>

  <script src="./figures.js?v=3"></script>
  <script>
    const LINE = '#241F1A';
    const INKS = ['#E5342B', '#F5811F', '#FFC21A', '#7DC242', '#2FA84F', '#00A99D',
      '#35B5EC', '#2C6FD1', '#9A4FD6', '#D6249B', '#FF5B8D', '#4FD1A5'];
    const F = window.FOLD_FIGURES, draw = window.FOLD_DRAW_FIGURE;
    const out = document.getElementById('grid-out');
    const gridSel = document.getElementById('grid'), modeSel = document.getElementById('mode');
    document.getElementById('count').textContent = F.length + ' figures';

    function render() {
      const n = parseInt(gridSel.value, 10);
      const single = modeSel.value === 'one';
      out.innerHTML = '';
      F.forEach((fig, i) => {
        const wrap = document.createElement('div'); wrap.className = 'wrap';
        const cell = document.createElement('div'); cell.className = 'cell';
        const cv = document.createElement('canvas');
        const S = 360; cv.width = cv.height = S;
        const g = cv.getContext('2d');
        g.save(); g.scale(S, S);
        draw(g, fig, single ? INKS[0] : INKS[i % INKS.length], LINE);
        g.restore();
        if (n) {
          g.strokeStyle = 'rgba(0,0,0,0.30)'; g.lineWidth = 1; g.setLineDash([5, 5]);
          for (let k = 1; k < n; k++) {
            g.beginPath(); g.moveTo(k * S / n, 0); g.lineTo(k * S / n, S); g.stroke();
            g.beginPath(); g.moveTo(0, k * S / n); g.lineTo(S, k * S / n); g.stroke();
          }
          g.setLineDash([]);
        }
        cell.appendChild(cv);
        const nm = document.createElement('div'); nm.className = 'name'; nm.textContent = fig.name;
        wrap.appendChild(cell); wrap.appendChild(nm);
        out.appendChild(wrap);
      });
    }
    gridSel.onchange = modeSel.onchange = render;
    render();
  </script>
</body>
</html>
