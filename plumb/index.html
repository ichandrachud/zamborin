<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
  <title>Plumb — static preview</title>
  <meta name="theme-color" content="#0A1A2F" />
  <meta name="robots" content="noindex" />
  <link rel="icon" type="image/svg+xml" href="/images/zamborin-favicon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    html, body { margin: 0; padding: 0; height: 100%; background: #0A1A2F; overflow: hidden; }
    body {
      display: flex; align-items: center; justify-content: center;
      font-family: Inter, system-ui, -apple-system, sans-serif; color: #fff;
      -webkit-font-smoothing: antialiased;
    }
    .game-wrap { position: relative; line-height: 0; width: var(--canvas-w, 940px); height: var(--canvas-h, 660px); }
    canvas {
      display: block; width: 100%; height: 100%;
      touch-action: none;
      -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent;
    }
  </style>
</head>
<body>
  <div class="game-wrap">
    <canvas id="game" aria-label="Plumb mobile preview"></canvas>
  </div>
  <script src="./model.js?v=1"></script>
  <script src="./levels.js?v=1"></script>
  <script src="./play.js?v=2"></script>
</body>
</html>
