<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
  <title>Pins — prototype</title>
  <meta name="theme-color" content="#0A1A2F" />
  <meta name="robots" content="noindex" />
  <link rel="icon" type="image/svg+xml" href="/images/zamborin-favicon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    /* Bare prototype shell. Section 7.5: every moving pixel on screen must be
       the simulation — so there is no transition, no hover animation, nothing
       that breathes. In a game about detecting motion, decorative motion is a
       lie in the feedback channel. */
    html, body { margin: 0; padding: 0; height: 100%; background: #0A1A2F; overflow: hidden; }
    body {
      display: flex; align-items: center; justify-content: center;
      font-family: Inter, system-ui, -apple-system, sans-serif; color: #fff;
      -webkit-font-smoothing: antialiased;
    }
    .game-wrap { position: relative; line-height: 0; }
    canvas {
      display: block; width: 100%; height: 100%;
      touch-action: none;
      -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent;
    }

    /* Splash. Copied from shared/chrome.css rather than pulling the whole file
       in, because this is still a bare prototype with no site chrome. If PINS
       is ever housed properly, delete this block and let chrome.css do it.
       Unlike Orbit/Fold/Bloom, this game's desktop frame is LANDSCAPE (a fixed
       900x560), so it takes the 1200x630 art rather than the 1120x1280 portrait
       piece — cover-fitting the portrait art into this frame sliced the wordmark
       in half. Position is 10%, not centre: cover crops 167px horizontally here,
       and centring puts the left edge of "PINS" at -52px. Mobile is portrait art
       in a portrait frame, so it centres normally.
       The ?v= is deliberate: any browser that hit this page before the art
       existed cached a 404 against the bare filename. Bump it when art changes. */
    .splash {
      position: absolute; inset: 0; z-index: 10;
      background-color: #0A1A2F;
      background-size: cover; background-position: 10% center; background-repeat: no-repeat;
      background-image: url('./splash-desktop.jpg?v=2');
      transition: opacity 0.6s ease-out;
      pointer-events: auto;
    }
    .splash.fading { opacity: 0; pointer-events: none; }
    @media (max-width: 767px) {
      .splash { background-image: url('./splash-mobile.jpg?v=1'); background-position: center; }
    }
    @media (prefers-reduced-motion: reduce) { .splash { transition: none; } }
  </style>
</head>
<body>
  <div class="game-wrap">
    <canvas id="game" aria-label="Pins puzzle"></canvas>
    <div id="splash" class="splash" aria-hidden="true"></div>
  </div>
  <script>
    // Hold the art for 2s, fade out, then tell the game so it can redraw at the
    // size it actually ended up at. Same timing as every other Zamborin game.
    (() => {
      const splash = document.getElementById('splash');
      if (!splash) return;
      const done = () => {
        splash.remove();
        window.dispatchEvent(new CustomEvent('splash-done'));
      };
      setTimeout(() => {
        splash.classList.add('fading');
        // transitionend alone is not enough: it never fires under
        // prefers-reduced-motion, and the splash would sit there forever.
        let fired = false;
        const once = () => { if (!fired) { fired = true; done(); } };
        splash.addEventListener('transitionend', once, { once: true });
        setTimeout(once, 800);
      }, 2000);
      splash.addEventListener('pointerdown', () => { splash.classList.add('fading'); });
    })();
  </script>
  <script src="../shared/sfx.js?v=1"></script>
  <script src="./levels.js?v=2"></script>
  <script src="./play.js?v=20"></script>
</body>
</html>
