<?xml version="1.0" encoding="UTF-8"?>
<!--
  Zamborin wordmark, knockout (white type) for the site's dark chrome.
  Source: zamborin_logos/zamborin-ko.svg, 2026-08-21.

  Two things were changed from the Illustrator export and both matter:

  1. The viewBox was an A4 page, 0 0 595.28 841.89, with the artwork filling
     2.15% of it. Rendered at the header's 36px that would have put the mark
     about 1.7px tall. It is now cropped to the measured bounding box.
  2. The gradient ids and the .st0-style class names were the generic ones
     Illustrator emits, identical in every file it exports. They are namespaced
     so this file and the favicon can never collide if either is ever inlined.

  The gradients are userSpaceOnUse, so their coordinates are unaffected by the
  crop. Do not re-colour this per theme: white on dark, dark type on light, and
  the light version is zamborin_logos/zamborin-rgb.svg.
-->
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" viewBox="169.06 304.86 269.27 40.1">
  <defs>
    <style>
      .zl-mark-a { fill: url(#zl-grad-a); }
      .zl-mark-b { fill: url(#zl-grad-b); }
      .zl-mark-c { fill: url(#zl-grad-c); }
      .zl-type   { fill: #fff; }
    </style>
    <linearGradient id="zl-grad-c" x1="174.75" y1="338.26" x2="199.72" y2="313.28" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#3349e5"/>
      <stop offset="1" stop-color="#b734e2"/>
    </linearGradient>
    <linearGradient id="zl-grad-b" x1="175.77" y1="339.28" x2="200.74" y2="314.3" xlink:href="#zl-grad-c"/>
    <linearGradient id="zl-grad-a" x1="162.08" y1="324.91" x2="291.7" y2="324.91" gradientUnits="userSpaceOnUse">
      <stop offset=".09" stop-color="#fff"/>
      <stop offset="1" stop-color="#231f20"/>
    </linearGradient>
  </defs>
