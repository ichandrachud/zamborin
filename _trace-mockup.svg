<svg xmlns="http://www.w3.org/2000/svg" width="760" height="600" viewBox="0 0 760 600" role="img">
<title>Trace — in-game screen mockup</title>
<desc>A deep blue game board. A four-bar linkage built from perforated strips is pinned to a faint peg lattice. A warm cream curve, drawn by a pen point on the coupler triangle, sweeps across the board and passes through three lit target dots; two unlit targets wait ahead on the part of the curve not yet drawn. A tray at the bottom shows three spare strips.</desc>
