<!doctype html><html><head><meta charset="utf-8"><title>Ballast splash safe zone</title>
<style>body{background:#0E1726;color:#fff;font:12px/1.6 ui-monospace,monospace;margin:14px}#o{white-space:pre}</style>
</head><body><div id="o">measuring…</div><script>
/* Find the wordmark by pixel, then ask whether `cover` can crop it.
   The house rule is that key art stays inside the central 90% width and 85%
   height, and the wordmark inside 0.38 / imageAspect of the width. Eyeballing
   a scaled render cannot answer that, so measure the actual pixels. */
const SHOTS = [
  { name: 'splash-mobile',  src: '/ballast/splash-mobile.jpg?sz=1' },
  { name: 'splash-desktop', src: '/ballast/splash-desktop.jpg?sz=1' },
  { name: 'og',             src: '/images/ballast-og.jpg?sz=1' },
  { name: 'teaser',         src: '/images/ballast-teaser.jpg?sz=1' }
];
// Portrait containers a phone actually presents, and the desktop frame.
const CONTAINERS = {
  'splash-mobile':  [[375,667],[390,844],[393,852],[430,932],[344,882],[360,640],[412,915]],
  'splash-desktop': [[760,600],[1520,1200]],
  'og': [[1200,630]], 'teaser': [[1200,800]]
};
const load = src => new Promise(r => { const i = new Image(); i.onload = () => r(i); i.src = src; });
(async () => {
  const L = [];
  for (const s of SHOTS) {
    const img = await load(s.src);
    const W = img.naturalWidth, H = img.naturalHeight;
    const c = document.createElement('canvas'); c.width = W; c.height = H;
    const g = c.getContext('2d'); g.drawImage(img, 0, 0);
    const d = g.getImageData(0, 0, W, H).data;
    /* Finding the wordmark by "bright" alone does not work: the glowing
       orbs and the specular highlights are bright too, and a first pass
       reported the wordmark spanning 4.7% to 70.5% of the height, which is
       the bowl. Type is NEUTRAL white; the forge art is warm, so red minus
       blue separates them. Then take the densest contiguous band of rows,
       because text is dense along a row and highlights are not. */
    const isType = (i) => {
      const r = d[i], g = d[i+1], b = d[i+2];
      const mx = Math.max(r,g,b), mn = Math.min(r,g,b);
      return mn > 236 && (mx - mn) <= 8;
    };
    const rowN = new Array(H).fill(0);
    for (let y = 0; y < H; y++) {
      let c2 = 0;
      for (let x = 0; x < W; x++) if (isType((y*W+x)*4)) c2++;
      rowN[y] = c2;
    }
    const peak = Math.max(...rowN);
    const thresh = Math.max(6, peak * 0.12);
    let bestA = -1, bestB = -1, a = -1;
    for (let y = 0; y <= H; y++) {
      if (y < H && rowN[y] >= thresh) { if (a < 0) a = y; }
      else if (a >= 0) { if (bestA < 0 || (y - a) > (bestB - bestA)) { bestA = a; bestB = y; } a = -1; }
    }
    let minX = 1e9, maxX = -1, minY = bestA, maxY = bestB - 1, n = 0;
    for (let y = bestA; y < bestB; y++) {
      for (let x = 0; x < W; x++) {
        if (isType((y*W+x)*4)) { n++; if (x < minX) minX = x; if (x > maxX) maxX = x; }
      }
    }
    const aspect = W / H;
    const wmW = (maxX - minX) / W;
    L.push(`${s.name}  ${W}x${H}  aspect ${aspect.toFixed(4)}`);
    if (n < 200) { L.push('   no white wordmark found in this image'); L.push(''); continue; }
    /* The 0.38 / aspect rule is for PORTRAIT splash art, where `cover` on a
       narrower phone crops the sides. It says nothing useful about landscape
       art: at aspect 1.9 it demands a 20% wordmark, which forbids having one.
       For landscape the real question is the container test below, and for
       OG and teaser images there is no cropping container at all. */
    if (aspect < 1) {
      const wmRule = 0.38 / aspect;
      L.push(`   wordmark x ${(minX/W*100).toFixed(1)}% .. ${(maxX/W*100).toFixed(1)}%   width ${(wmW*100).toFixed(1)}%   portrait rule allows ${(wmRule*100).toFixed(1)}%   ${wmW <= wmRule ? 'PASS' : 'FAIL'}`);
    } else {
      L.push(`   wordmark x ${(minX/W*100).toFixed(1)}% .. ${(maxX/W*100).toFixed(1)}%   width ${(wmW*100).toFixed(1)}%   (landscape: the crop test below is the real one)`);
    }
    L.push(`   wordmark y ${(minY/H*100).toFixed(1)}% .. ${(maxY/H*100).toFixed(1)}%`);
    let worst = null;
    for (const [cw, ch] of CONTAINERS[s.name]) {
      const ca = cw / ch;
      let vx0 = 0, vx1 = 1, vy0 = 0, vy1 = 1;
      if (aspect > ca) { const f = ca / aspect; vx0 = (1 - f) / 2; vx1 = 1 - vx0; }   // crops sides
      else             { const f = aspect / ca; vy0 = (1 - f) / 2; vy1 = 1 - vy0; }   // crops top/bottom
      const clipped = (minX/W < vx0) || (maxX/W > vx1) || (minY/H < vy0) || (maxY/H > vy1);
      const marginX = Math.min(minX/W - vx0, vx1 - maxX/W) * 100;
      const marginY = Math.min(minY/H - vy0, vy1 - maxY/H) * 100;
      const m = Math.min(marginX, marginY);
      if (worst === null || m < worst.m) worst = { cw, ch, m, clipped };
    }
    L.push(`   tightest container ${worst.cw}x${worst.ch}: ${worst.clipped ? 'WORDMARK CLIPPED' : 'clear by ' + worst.m.toFixed(1) + '% of the frame'}`);
    L.push('');
  }
  document.getElementById('o').textContent = L.join('\n');
  document.title = 'SZDONE';
})();
</script></body></html>
